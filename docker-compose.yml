services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: opspilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opspilot -d opspilot']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 数据库结构只由显式迁移管理；应用进程禁止在启动时自动改表。
  init-db:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://opspilot:${POSTGRES_PASSWORD}@db:5432/opspilot
      DB_AUTO_CREATE_TABLES: '0'
    command:
      - /bin/sh
      - -c
      - |
        if alembic upgrade head > /tmp/alembic-upgrade.log 2>&1; then
          cat /tmp/alembic-upgrade.log
          echo INIT_DB_OK
        elif grep -q "Can't locate revision" /tmp/alembic-upgrade.log; then
          # 数据库的 revision 比本镜像新（回滚到旧镜像时）：旧镜像不认识新
          # revision，硬跑只会 exit 255 拖垮整组依赖；跳过迁移，应用直接起。
          echo 'INIT_DB_SKIP: database revision is newer than this image, skipping migration'
        else
          cat /tmp/alembic-upgrade.log >&2
          exit 1
        fi
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://opspilot:${POSTGRES_PASSWORD}@db:5432/opspilot
      DB_AUTO_CREATE_TABLES: '0'
    ports:
      - '8001:8001'
    depends_on:
      db:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    volumes:
      - backend-storage:/app/storage
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/settings/login-page', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - '8080:8080'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  backend-storage:
