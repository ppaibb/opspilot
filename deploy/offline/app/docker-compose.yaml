# OpsPilot 应用栈：PostgreSQL + 初始化容器 + 后端 + 前端
# 由 install.sh 生成/覆盖环境变量后启动。
name: opspilot-app

services:
  db:
    image: postgres:16-alpine
    container_name: opspilot-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-opspilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-opspilot} -d $${POSTGRES_DB:-opspilot}']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # 初始化容器：等 DB 健康后执行 Alembic 迁移（生产 DB_AUTO_CREATE_TABLES=0）
  init-db:
    image: ${OPSPILOT_BACKEND_IMAGE:-opspilot/backend:1.0.0}
    container_name: opspilot-init-db
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-opspilot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-opspilot}
      DB_AUTO_CREATE_TABLES: '0'
      SECRET_KEY: ${SECRET_KEY:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
    working_dir: /app
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if alembic upgrade head > /tmp/alembic-upgrade.log 2>&1; then
          cat /tmp/alembic-upgrade.log
          echo INIT_DB_OK
        elif grep -q "Can't locate revision" /tmp/alembic-upgrade.log; then
          # 数据库的 revision 比本镜像新（回滚到旧镜像时）：旧镜像不认识新
          # revision，硬跑只会 exit 255 拖垮整组依赖；跳过迁移，应用直接起。
          echo 'INIT_DB_SKIP: database revision is newer than this image, skipping migration'
        else
          cat /tmp/alembic-upgrade.log >&2
          exit 1
        fi
    restart: 'no'

  backend:
    image: ${OPSPILOT_BACKEND_IMAGE:-opspilot/backend:1.0.0}
    container_name: opspilot-backend
    depends_on:
      db:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    env_file:
      # install.sh 会生成 app/.env；未安装时允许 config 校验通过
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-opspilot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-opspilot}
      DB_AUTO_CREATE_TABLES: '0'
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    volumes:
      - backend-storage:/app/storage
      - backend-logs:/app/logs
    networks:
      - default
      - opspilot-bridge
    restart: unless-stopped

  frontend:
    image: ${OPSPILOT_FRONTEND_IMAGE:-opspilot/frontend:1.0.0}
    container_name: opspilot-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  opspilot-bridge:
    name: opspilot-monitoring-bridge
    external: true

volumes:
  pgdata:
    name: ${OPSPILOT_PROJECT:-opspilot}-pgdata
  backend-storage:
    name: ${OPSPILOT_PROJECT:-opspilot}-backend-storage
  backend-logs:
    name: ${OPSPILOT_PROJECT:-opspilot}-backend-logs
