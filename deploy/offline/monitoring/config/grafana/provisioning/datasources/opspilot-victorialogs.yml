# OpsPilot 内置 Grafana 数据源：VictoriaLogs（日志查询）
# 日志查询页的「Grafana」钻取跳 Explore 时指向本数据源（uid opspilot-vlogs），
# 带上 LogsQL——日志钻取不能落回 VictoriaMetrics（指标库）。
#
# 依赖插件 victoriametrics-logs-datasource（不在 grafana.com 目录，GF_INSTALL_PLUGINS 会 404）：
# 手动下载 GitHub VictoriaMetrics/victorialogs-datasource releases 的 zip，解压进 /var/lib/grafana/plugins/ 再重启。
#
# 注意：Grafana 的数据源 provisioning **不做 ${VAR} 环境变量插值**（实测写了会被
# 静默忽略、继续用库里的旧值），所以这里只能写死地址。
apiVersion: 1

datasources:
  - name: OpsPilot VictoriaLogs
    uid: opspilot-vlogs
    type: victoriametrics-logs-datasource
    access: proxy
    # 与监控栈同 compose 网络时用服务名解析。
    url: http://victorialogs:9428
    isDefault: false
    editable: false
