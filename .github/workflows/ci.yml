name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: ci-password-only
          POSTGRES_DB: opspilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opspilot -d opspilot_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://opspilot:ci-password-only@127.0.0.1:5432/opspilot_test
      POSTGRES_PASSWORD: ci-password-only
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      CREDENTIAL_ENCRYPTION_KEY: ci-only-independent-encryption-key-32chars
      GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
      GRAFANA_AUTH_PROXY_WHITELIST: 172.30.250.0/24
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt pip-audit

      - name: Install root tooling (pyflakes)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install pyflakes

      - name: Install frontend deps
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Backend pytest
        working-directory: backend
        run: .venv/bin/python -m pytest -q

      - name: Alembic full upgrade
        working-directory: backend
        run: .venv/bin/python -m alembic upgrade head

      - name: Pyflakes undefined names
        run: .venv/bin/python -m pyflakes backend/app

      - name: Dependency audits
        run: |
          backend/.venv/bin/pip-audit -r backend/requirements.txt
          cd frontend && pnpm audit --audit-level high

      - name: Frontend lint
        run: pnpm --dir frontend run lint

      - name: Frontend test
        run: pnpm --dir frontend run test

      - name: Frontend build
        run: pnpm --dir frontend run build

      - name: Compose validation
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f deploy/monitoring/docker-compose.yml config --quiet
          docker compose -f deploy/offline/app/docker-compose.yaml --env-file deploy/offline/env.example config --quiet
          docker compose -f deploy/offline/monitoring/docker-compose.yaml --env-file deploy/offline/env.example config --quiet

      - name: Container builds
        run: |
          docker build -t opspilot/backend:ci backend
          docker build -t opspilot/frontend:ci frontend
